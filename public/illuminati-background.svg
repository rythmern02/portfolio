<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper Texture -->
    <pattern id="paperTexture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#ffffff"/>
      <circle cx="20" cy="30" r="0.5" fill="#f8f8f8"/>
      <circle cx="80" cy="70" r="0.3" fill="#f5f5f5"/>
      <circle cx="45" cy="85" r="0.4" fill="#f7f7f7"/>
      <circle cx="60" cy="15" r="0.2" fill="#f9f9f9"/>
    </pattern>
    
    <!-- Torn Paper Effect -->
    <filter id="roughPaper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    
    <!-- Shadow Effect -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- All-Seeing Eye Gradient -->
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Illuminati Glow -->
    <filter id="illuminatiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Crack Pattern -->
    <pattern id="crackPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none"/>
      <path d="M50,0 L50,50 L100,100 L150,50 L200,100" stroke="#000000" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M0,75 L75,75 L100,125 L175,100 L200,150" stroke="#000000" stroke-width="1.5" fill="none" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Base White Background -->
  <rect width="1400" height="800" fill="url(#paperTexture)"/>
  
  <!-- Main Broken Paper Pieces -->
  
  <!-- Top Left Torn Page -->
  <g filter="url(#paperShadow)">
    <path d="M0,0 L380,0 L360,180 L340,200 L300,190 L280,220 L240,200 L200,240 L160,220 L120,260 L80,240 L40,280 L0,260 Z" 
          fill="#ffffff" filter="url(#roughPaper)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="8s" repeatCount="indefinite"/>
    </path>
    <!-- Black revealed underneath -->
    <path d="M200,120 L360,120 L340,200 L320,180 L280,220 L240,200 L200,240 Z" fill="#000000" opacity="0.8"/>
  </g>
  
  <!-- Top Right Broken Page -->
  <g filter="url(#paperShadow)">
    <path d="M1020,0 L1400,0 L1400,240 L1380,260 L1340,240 L1300,280 L1260,260 L1220,300 L1180,280 L1140,320 L1100,300 L1060,340 L1020,160 Z" 
          fill="#ffffff" filter="url(#roughPaper)">
      <animate attributeName="opacity" values="1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Black void beneath -->
    <path d="M1180,80 L1380,80 L1380,260 L1340,240 L1300,280 L1260,260 L1220,300 L1180,280 Z" fill="#000000" opacity="0.7"/>
  </g>
  
  <!-- Bottom Left Fragment -->
  <g filter="url(#paperShadow)">
    <path d="M0,540 L0,800 L420,800 L400,780 L380,740 L340,720 L320,680 L280,660 L260,620 L220,600 L200,560 L160,580 L120,540 L80,560 L40,520 Z" 
          fill="#ffffff" filter="url(#roughPaper)">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="10s" repeatCount="indefinite"/>
    </path>
    <!-- Black tear -->
    <path d="M120,640 L380,640 L360,740 L340,720 L300,760 L260,740 L220,780 L180,760 L140,800 L120,760 Z" fill="#000000" opacity="0.6"/>
  </g>
  
  <!-- Bottom Right Shattered Piece -->
  <g filter="url(#paperShadow)">
    <path d="M980,520 L1160,480 L1180,500 L1220,480 L1260,500 L1300,480 L1340,500 L1380,480 L1400,520 L1400,800 L980,800 Z" 
          fill="#ffffff" filter="url(#roughPaper)">
      <animate attributeName="opacity" values="1;0.9;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- Dark void -->
    <path d="M1080,580 L1300,560 L1320,600 L1280,620 L1260,660 L1220,640 L1200,680 L1160,660 L1140,700 L1100,680 L1080,720 Z" fill="#000000" opacity="0.75"/>
  </g>
  
  <!-- Central Damaged Area -->
  <g filter="url(#paperShadow)">
    <path d="M420,200 L980,180 L960,240 L920,220 L880,260 L840,240 L800,280 L760,260 L720,300 L680,280 L640,320 L600,300 L560,340 L520,320 L480,360 L440,340 L420,380 Z" 
          fill="#ffffff" filter="url(#roughPaper)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- Major black revelation -->
    <path d="M520,220 L880,200 L860,260 L820,240 L780,280 L740,260 L700,300 L660,280 L620,320 L580,300 L540,340 L520,300 Z" fill="#000000" opacity="0.9"/>
  </g>
  
  <!-- ILLUMINATI SYMBOLS -->
  
  <!-- All-Seeing Eye (Main) -->
  <g transform="translate(700,400)" filter="url(#illuminatiGlow)">
    <!-- Pyramid -->
    <path d="M0,-60 L-52,30 L52,30 Z" fill="none" stroke="#000000" stroke-width="3">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Eye -->
    <ellipse cx="0" cy="-10" rx="20" ry="12" fill="url(#eyeGradient)" stroke="#000000" stroke-width="2">
      <animate attributeName="ry" values="12;8;12" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Pupil -->
    <circle cx="0" cy="-10" r="6" fill="#000000">
      <animate attributeName="r" values="6;4;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Rays -->
    <g stroke="#000000" stroke-width="2" opacity="0.8">
      <path d="M0,-80 L0,-70">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M-15,-75 L-10,-67">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M15,-75 L10,-67">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M-25,-65 L-18,-60">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M25,-65 L18,-60">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- Secondary Illuminati Triangles -->
  <g opacity="0.6" stroke="#000000" stroke-width="2" fill="none">
    <!-- Top Left Triangle -->
    <path d="M200,100 L240,160 L160,160 Z" transform="rotate(15 200 140)">
      <animateTransform attributeName="transform" type="rotate" values="15 200 140;375 200 140" dur="20s" repeatCount="indefinite"/>
    </path>
    
    <!-- Top Right Triangle -->
    <path d="M1200,120 L1240,180 L1160,180 Z" transform="rotate(-20 1200 160)">
      <animateTransform attributeName="transform" type="rotate" values="-20 1200 160;340 1200 160" dur="25s" repeatCount="indefinite"/>
    </path>
    
    <!-- Bottom Left Triangle -->
    <path d="M180,650 L220,710 L140,710 Z" transform="rotate(45 180 680)">
      <animateTransform attributeName="transform" type="rotate" values="45 180 680;405 180 680" dur="18s" repeatCount="indefinite"/>
    </path>
    
    <!-- Bottom Right Triangle -->
    <path d="M1220,620 L1260,680 L1180,680 Z" transform="rotate(-30 1220 650)">
      <animateTransform attributeName="transform" type="rotate" values="-30 1220 650;330 1220 650" dur="22s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Masonic Compass and Square -->
  <g transform="translate(300,300)" opacity="0.7" stroke="#000000" stroke-width="2" fill="none">
    <!-- Compass -->
    <path d="M0,-20 L-15,15 M0,-20 L15,15">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Square -->
    <path d="M-20,20 L-20,5 L5,5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- G Symbol -->
    <text x="0" y="0" font-family="serif" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">G</text>
  </g>
  
  <!-- Pentagram -->
  <g transform="translate(1100,300)" opacity="0.6" stroke="#000000" stroke-width="2" fill="none">
    <path d="M0,-25 L-23.8,7.7 L14.7,-9.5 L-14.7,-9.5 L23.8,7.7 Z">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Occult Numbers -->
  <g font-family="serif" font-size="24" fill="#000000" opacity="0.5">
    <text x="150" y="400" text-anchor="middle">13</text>
    <text x="1250" y="450" text-anchor="middle">33</text>
    <text x="500" y="150" text-anchor="middle">23</text>
    <text x="900" y="650" text-anchor="middle">77</text>
  </g>
  
  <!-- Crack Lines Spreading -->
  <g stroke="#000000" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Major crack from center -->
    <path d="M700,400 L650,350 L600,380 L550,330 L500,360">
      <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M700,400 L750,450 L800,420 L850,470 L900,440">
      <animate attributeName="stroke-dasharray" values="0,180;90,90;180,0" dur="7s" repeatCount="indefinite"/>
    </path>
    
    <!-- Secondary cracks -->
    <path d="M400,300 L350,250 L300,280 L250,230">
      <animate attributeName="stroke-dasharray" values="0,150;75,75;150,0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M1000,500 L1050,550 L1100,520 L1150,570">
      <animate attributeName="stroke-dasharray" values="0,160;80,80;160,0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Hidden Messages in Cracks -->
  <g font-family="serif" font-size="8" fill="#000000" opacity="0.3" transform="rotate(15 700 400)">
    <text x="520" y="340">ORDO AB CHAO</text>
    <text x="820" y="460" transform="rotate(-30 820 460)">NOVUS ORDO</text>
    <text x="580" y="480" transform="rotate(45 580 480)">ANNUIT COEPTIS</text>
  </g>
  
  <!-- Subtle Grid Pattern in Black Areas -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.1" fill="none">
    <defs>
      <pattern id="secretGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30,0 L0,0 L0,30" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="200" y="120" width="160" height="120" fill="url(#secretGrid)" opacity="0.2"/>
    <rect x="1180" y="80" width="200" height="200" fill="url(#secretGrid)" opacity="0.15"/>
    <rect x="520" y="220" width="360" height="120" fill="url(#secretGrid)" opacity="0.2"/>
  </g>
</svg>
